var LSK="filterCart",NUM={raha:"971502676751",bateen:"97125858987"};
var TXT={en:{from:"from",intro:"Hi FILTER! I'd like to enquire about the following:",total:"Estimated total",close:"What times are available?"},
 ar:{from:"من",intro:"مرحباً فلتر! أود الاستفسار عن الخدمات التالية:",total:"الإجمالي التقريبي",close:"ما الأوقات المتاحة؟"},

var lang="en";
function load(){try{return JSON.parse(localStorage.getItem(LSK))||[];}catch(e){return[];}}
function save(c){try{localStorage.setItem(LSK,JSON.stringify(c));}catch(e){}}
function fmt(p,f){return (f?TXT[lang].from+" ":"")+"AED "+p.toLocaleString("en-US");}
function total(c){var s=0,f=false;c.forEach(function(i){s+=i.p;if(i.f)f=true;});return{s:s,f:f};}
function msgAll(c){var t=TXT[lang],lines=c.map(function(i){return "• "+i.n+" — "+(i.f?t.from+" ":"")+"AED "+i.p;});

function render(){

     '<button class="crm" type="button" data-ix="'+ix+'" aria-label="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>';}).join('');

  document.getElementById("waBateen").href="https://wa.me/"+NUM.bateen+"?text="+m;
}
document.addEventListener("click",function(e){
  var lb=e.target.closest(".lp button");
